# Systems Lean host: Mult + MultTheorems + Linear + LinearTheorems + Types + TypesTheorems + ordered IR program + Erasure + ErasureTheorems + Extract +
# ExtractTheorems + IrGraph + HostCompose + EmitPlan + EmitApply + EmitBody + EmitBanner + CompilePath + CompilePathBody + CompilePathErasure + CompilePathPlan + CompilePathApply + CompilePathGraph + CompilePathCompose + CompilePathMult + CompilePathLinear + CompilePathTypes + CompilePathProgram + CompilePathExtract + JoinMap
# + SelfHost + SelfHostTheorems + SurfaceMatrix + KernelMult + EmitMult + EmitLinear + EmitErasure + ParityMult +
# ParityMultTheorems + KernelLinear + KernelLinearTheorems + ParityLinear + ParityLinearTheorems + KernelTypes + KernelTypesTheorems + ParityTypes + ParityTypesTheorems + KernelProgram +
# ParityProgram + ParityProgramTheorems + KernelEmit + ParityEmit + SelfApply + SelfApplyFs + LlvmHold + LlvmHoldTheorems +
# InventoryClose + InventoryCloseTheorems + ProductPath + DualResidual + ProbeWire + ProbeWireTheorems +
# SpecProof + SelfHostBody (Mult..SelfHostBody) under classic Lean elaborator.
# Not freestanding residual free. Not product C. No remote dependencies.
# Offline: lake-manifest.json has empty packages (mirror src/lean4 policy).
name = "SystemsLean"
version = "0.1.0"
defaultTargets = ["SystemsLean"]

[[lean_lib]]
name = "SystemsLean"
srcDir = "."
roots = ["SystemsLean"]

# Lean-owned freestanding product C emit (SLAKE_EMIT_FREESTANDING_C_V0).
# Writes src/systems/emit/slake_freestanding.{h,c}; never out/freestanding-c/.
# Invoked by just build. Not residual free; not PROVABLY.
# Thin main module: keeps FreestandingEmit library free of top-level main so
# B13 ProductPathWriteHc (and similar) may import emitAtRoot + declare own main.
[[lean_exe]]
name = "slake-emit-freestanding-c"
root = "SystemsLean.FreestandingEmitMain"
supportInterpreter = true

# Partial B11: decomposed READ dual SSOT only (no FreestandingEmit compose/write).
# Invoked by just read-product-ssot. Not freestanding perform claimed; not free.
# Lake root is ProductPathReadSsotMain (thin); Ok/PartialReady bulk in ProductPathReadSsot.
[[lean_exe]]
name = "slake-read-product-ssot"
root = "SystemsLean.ProductPathReadSsotMain"
supportInterpreter = true

# Partial B12: decomposed COMPOSE plan/apply/body only (no FreestandingEmit write).
# Invoked by just compose-product-plan. Not freestanding perform claimed; not free.
# Lake root is ProductPathComposePlanMain (thin); Ok/PartialReady bulk in ProductPathComposePlan.
[[lean_exe]]
name = "slake-compose-product-plan"
root = "SystemsLean.ProductPathComposePlanMain"
supportInterpreter = true

